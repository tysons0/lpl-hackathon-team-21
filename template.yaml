AWSTemplateFormatVersion: "2010-09-09"
Description: Advisor Match + First Meeting Ready - agentic stack (Strands on Bedrock, Lambda, S3/CloudFront, DynamoDB, Cognito, Transcribe, Polly)

Parameters:
  Prefix:
    Type: String
    Default: advisor-match
    AllowedPattern: "[a-z0-9-]+"
  ArtifactBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  LayerKey:
    Type: String
  ModelId:
    Type: String
  ExistingLambdaRoleArn:
    Type: String
    Default: ""
    Description: Optional. Use a pre-made Lambda execution role if your account can't create IAM roles.

Conditions:
  CreateRole: !Equals [!Ref ExistingLambdaRoleArn, ""]

Resources:
  # ---------------- data ----------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-bookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: booking_id, AttributeType: S}
      KeySchema:
        - {AttributeName: booking_id, KeyType: HASH}

  FunnelTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-funnel
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: day, AttributeType: S}
        - {AttributeName: ts_id, AttributeType: S}
      KeySchema:
        - {AttributeName: day, KeyType: HASH}
        - {AttributeName: ts_id, KeyType: RANGE}

  # ---------------- compliance ----------------
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ${Prefix}-guardrail
      Description: Blocks personalized investment advice and sensitive identifiers
      BlockedInputMessaging: "That's a great question for your advisor - I can help you get ready to ask it. (I can't give investment advice or accept account or Social Security numbers.)"
      BlockedOutputsMessaging: "That's a great question for your advisor - I can help you get ready to ask it."
      TopicPolicyConfig:
        TopicsConfig:
          - Name: Personalized investment advice
            Type: DENY
            Definition: Block requests for a specific buy, sell, hold, asset allocation, or trade action. Allow general investing interest, getting-started help, and advisor matching.
            Examples:
              - Should I buy Tesla stock?
              - Which fund should I put my 401k in?
              - Is now a good time to sell my investments?
              - Should I sell my Apple shares and buy Nvidia instead?
              - Allocate 30% of my portfolio to bonds and the rest to tech stocks?
      ContentPolicyConfig:
        FiltersConfig:
          - {Type: HATE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: INSULTS, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: VIOLENCE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: MISCONDUCT, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE}
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - {Type: US_SOCIAL_SECURITY_NUMBER, Action: BLOCK}
          - {Type: US_BANK_ACCOUNT_NUMBER, Action: BLOCK}
          - {Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK}
          - {Type: US_PASSPORT_NUMBER, Action: BLOCK}

  GuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt Guardrail.GuardrailId
      Description: v2

  # ---------------- agent ----------------
  AgentRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: agent-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${DataBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
                Resource: [!GetAtt BookingsTable.Arn, !GetAtt FunnelTable.Arn]
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"

  StrandsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub ${Prefix}-strands
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      Content:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LayerKey

  AgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${Prefix}-agent
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_function.lambda_handler
      Role: !If [CreateRole, !GetAtt AgentRole.Arn, !Ref ExistingLambdaRoleArn]
      MemorySize: 1024
      Timeout: 90
      Layers: [!Ref StrandsLayer]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          GUARDRAIL_ID: !GetAtt Guardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt GuardrailVersion.Version
          DATA_BUCKET: !Ref DataBucket
          BOOKINGS_TABLE: !Ref BookingsTable
          FUNNEL_TABLE: !Ref FunnelTable

  AgentUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgentFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}", "http://localhost:5173"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 300

  AgentUrlPublicInvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgentUrlPublicInvokeFunction:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------------- frontend ----------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Prefix}-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${Prefix} web app
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html}

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------- voice (browser -> Transcribe) ----------------
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: AdvisorMatchGuests
      AllowUnauthenticatedIdentities: true

  GuestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: cognito-identity.amazonaws.com}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: {"cognito-identity.amazonaws.com:aud": !Ref IdentityPool}
              ForAnyValue:StringLike: {"cognito-identity.amazonaws.com:amr": unauthenticated}
      Policies:
        - PolicyName: transcribe-streaming-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [transcribe:StartStreamTranscriptionWebSocket, transcribe:StartStreamTranscription]
                Resource: "*"

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        unauthenticated: !GetAtt GuestRole.Arn

Outputs:
  WebUrl:
    Value: !Sub https://${Distribution.DomainName}
  ApiUrl:
    Value: !GetAtt AgentUrl.FunctionUrl
  FunctionName:
    Value: !Ref AgentFunction
  DataBucketName:
    Value: !Ref DataBucket
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  IdentityPoolId:
    Value: !Ref IdentityPool
  GuardrailId:
    Value: !GetAtt Guardrail.GuardrailId
