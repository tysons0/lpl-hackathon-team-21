AWSTemplateFormatVersion: "2010-09-09"
Description: Advisor Match intake API - API Gateway, Lambda, Bedrock Guardrails, DynamoDB, S3/CloudFront

Parameters:
  Prefix:
    Type: String
    Default: advisor-match
    AllowedPattern: "[a-z0-9-]+"
  ArtifactBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  ModelId:
    Type: String
  ModelResourceArns:
    Type: CommaDelimitedList
    Description: Exact selected model or inference profile ARN and its foundation model ARNs; resolved by the deployment script.
  GuardrailRevision:
    Type: String
    Default: v1
    Description: Change this when editing guardrail policies to publish a new pinned version.
  AdminToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional private dashboard token. Empty disables admin endpoints.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 20
    Description: Optional Lambda concurrency cap; 0 uses the account default to support low-quota accounts.
  ExistingLambdaRoleArn:
    Type: String
    Default: ""
    Description: Optional. Use a pre-made Lambda execution role if your account can't create IAM roles.

Conditions:
  CreateRole: !Equals [!Ref ExistingLambdaRoleArn, ""]
  LimitConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  # ---------------- demo request data ----------------
  BookingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Prefix}-bookings
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: booking_id, AttributeType: S}
      KeySchema:
        - {AttributeName: booking_id, KeyType: HASH}

  FunnelTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Prefix}-funnel
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: day, AttributeType: S}
        - {AttributeName: ts_id, AttributeType: S}
      KeySchema:
        - {AttributeName: day, KeyType: HASH}
        - {AttributeName: ts_id, KeyType: RANGE}

  # ---------------- architecture domain data ----------------
  AdvisorIntakeSessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Prefix}-sessions
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}

  AdvisorProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Prefix}-advisor-profiles
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: availabilityStatus, AttributeType: S}
        - {AttributeName: advisorId, AttributeType: S}
        - {AttributeName: geographyState, AttributeType: S}
        - {AttributeName: availabilityAdvisor, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: AvailabilityIndex
          KeySchema:
            - {AttributeName: availabilityStatus, KeyType: HASH}
            - {AttributeName: advisorId, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        # DynamoDB index keys must be top-level scalar attributes. Populate
        # geographyState from geography.state and availabilityAdvisor as
        # `${availabilityStatus}#${advisorId}` when writing a profile.
        - IndexName: GeoIndex
          KeySchema:
            - {AttributeName: geographyState, KeyType: HASH}
            - {AttributeName: availabilityAdvisor, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  GlossaryTermsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Prefix}-glossary-terms
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}

  # ---------------- compliance ----------------
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ${Prefix}-guardrail
      Description: Blocks personalized investment advice and sensitive identifiers
      BlockedInputMessaging: "That's a great question for your advisor - I can help you get ready to ask it. (I can't give investment advice or accept account or Social Security numbers.)"
      BlockedOutputsMessaging: "That's a great question for your advisor - I can help you get ready to ask it."
      TopicPolicyConfig:
        TopicsConfig:
          - Name: Personalized investment advice
            Type: DENY
            Definition: Recommending specific securities, funds or allocations, or telling the user what to buy, sell or hold, or when to trade.
            Examples:
              - Should I buy Tesla stock?
              - Which fund should I put my 401k in?
              - Is now a good time to sell my investments?
              - How much of my savings should go into crypto?
      ContentPolicyConfig:
        FiltersConfig:
          - {Type: HATE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: INSULTS, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: VIOLENCE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: MISCONDUCT, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE}
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - {Type: US_SOCIAL_SECURITY_NUMBER, Action: BLOCK}
          - {Type: US_BANK_ACCOUNT_NUMBER, Action: BLOCK}
          - {Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK}
          - {Type: US_PASSPORT_NUMBER, Action: BLOCK}
          - {Type: EMAIL, Action: ANONYMIZE}
          - {Type: PHONE, Action: ANONYMIZE}
          - {Type: ADDRESS, Action: ANONYMIZE}

  GuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt Guardrail.GuardrailId
      Description: !Ref GuardrailRevision

  LogsEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts Advisor Match CloudWatch log groups
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseForAdvisorMatchGroups
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-agent*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/events/${Prefix}-guardrail-audit*
              StringEquals:
                kms:ViaService: !Sub logs.${AWS::Region}.amazonaws.com

  LogsEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${Prefix}-logs
      TargetKeyId: !Ref LogsEncryptionKey

  GuardrailAuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/events/${Prefix}-guardrail-audit
      KmsKeyId: !GetAtt LogsEncryptionKey.Arn
      RetentionInDays: 90

  GuardrailAuditLogResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub ${Prefix}-guardrail-audit-events
      PolicyDocument: !Sub |
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["events.amazonaws.com"]},"Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"${GuardrailAuditLogGroup.Arn}:*"}]}

  GuardrailChangeRule:
    Type: AWS::Events::Rule
    DependsOn: GuardrailAuditLogResourcePolicy
    Properties:
      Description: Captures CloudTrail management events that change Bedrock guardrails.
      EventPattern:
        source: [aws.bedrock]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [bedrock.amazonaws.com]
          eventName: [CreateGuardrail, UpdateGuardrail, CreateGuardrailVersion, DeleteGuardrail]
      State: ENABLED
      Targets:
        - Arn: !GetAtt GuardrailAuditLogGroup.Arn
          Id: GuardrailAuditLog

  GuardrailChangeMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref GuardrailAuditLogGroup
      FilterPattern: '{ $.detail.eventName = "CreateGuardrail" || $.detail.eventName = "UpdateGuardrail" || $.detail.eventName = "CreateGuardrailVersion" || $.detail.eventName = "DeleteGuardrail" }'
      MetricTransformations:
        - MetricNamespace: !Sub ${Prefix}/BedrockGuardrail
          MetricName: GuardrailConfigurationChange
          MetricValue: "1"

  GuardrailChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A CloudTrail event changed or versioned the Bedrock guardrail; review the audit log.
      Namespace: !Sub ${Prefix}/BedrockGuardrail
      MetricName: GuardrailConfigurationChange
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------- agent ----------------
  AgentRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: agent-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref ModelResourceArns
                Condition:
                  StringEquals:
                    bedrock:GuardrailIdentifier: !Sub "${Guardrail.GuardrailArn}:${GuardrailVersion.Version}"
              - Effect: Deny
                Action: bedrock:InvokeModel
                Resource: !Ref ModelResourceArns
                Condition:
                  StringNotEquals:
                    bedrock:GuardrailIdentifier: !Sub "${Guardrail.GuardrailArn}:${GuardrailVersion.Version}"
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !GetAtt Guardrail.GuardrailArn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
                Resource: [!GetAtt BookingsTable.Arn, !GetAtt FunnelTable.Arn]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt AdvisorIntakeSessionsTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - !GetAtt AdvisorProfilesTable.Arn
                  - !Sub "${AdvisorProfilesTable.Arn}/index/AvailabilityIndex"
                  - !Sub "${AdvisorProfilesTable.Arn}/index/GeoIndex"
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt GlossaryTermsTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-agent:*

  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${Prefix}-agent
      KmsKeyId: !GetAtt LogsEncryptionKey.Arn
      RetentionInDays: 7

  AgentFunction:
    Type: AWS::Lambda::Function
    DependsOn: AgentLogGroup
    Properties:
      FunctionName: !Sub ${Prefix}-agent
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_function.lambda_handler
      Role: !If [CreateRole, !GetAtt AgentRole.Arn, !Ref ExistingLambdaRoleArn]
      MemorySize: 1024
      Timeout: 28
      ReservedConcurrentExecutions: !If [LimitConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          GUARDRAIL_ID: !GetAtt Guardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt GuardrailVersion.Version
          BOOKINGS_TABLE: !Ref BookingsTable
          FUNNEL_TABLE: !Ref FunnelTable
          SESSIONS_TABLE: !Ref AdvisorIntakeSessionsTable
          ADVISOR_PROFILES_TABLE: !Ref AdvisorProfilesTable
          GLOSSARY_TABLE: !Ref GlossaryTermsTable
          ADMIN_TOKEN: !Ref AdminToken

  AgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Agent Lambda errors in a five-minute window; inspect the function log group.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AdvisorApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${Prefix}-api
      Description: Synchronous advisor intake API
      EndpointConfiguration:
        Types: [REGIONAL]
      ApiKeySourceType: HEADER

  SessionResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdvisorApi
      ParentId: !GetAtt AdvisorApi.RootResourceId
      PathPart: session

  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdvisorApi
      ParentId: !GetAtt AdvisorApi.RootResourceId
      PathPart: health

  HealthMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentFunction.Arn}/invocations

  MetricsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdvisorApi
      ParentId: !GetAtt AdvisorApi.RootResourceId
      PathPart: metrics

  MetricsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref MetricsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentFunction.Arn}/invocations

  MetricsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref MetricsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'content-type,authorization,x-admin-token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  BookingsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdvisorApi
      ParentId: !GetAtt AdvisorApi.RootResourceId
      PathPart: bookings

  BookingsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref BookingsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentFunction.Arn}/invocations

  BookingsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref BookingsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'content-type,authorization,x-admin-token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  SessionMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref SessionResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentFunction.Arn}/invocations

  SessionOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref SessionResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'content-type,authorization,x-admin-token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  SessionIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdvisorApi
      ParentId: !Ref SessionResource
      PathPart: "{id}"

  SessionMessageResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdvisorApi
      ParentId: !Ref SessionIdResource
      PathPart: message

  SessionMessageMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref SessionMessageResource
      HttpMethod: POST
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentFunction.Arn}/invocations

  SessionMessageOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref SessionMessageResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'content-type,authorization,x-admin-token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ApiProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdvisorApi
      ParentId: !GetAtt AdvisorApi.RootResourceId
      PathPart: "{proxy+}"

  ApiProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdvisorApi
      ResourceId: !Ref ApiProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentFunction.Arn}/invocations

  AdvisorApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - SessionMethod
      - SessionOptionsMethod
      - SessionMessageMethod
      - SessionMessageOptionsMethod
      - HealthMethod
      - MetricsMethod
      - MetricsOptionsMethod
      - BookingsMethod
      - BookingsOptionsMethod
      - ApiProxyMethod
    Properties:
      RestApiId: !Ref AdvisorApi
      StageName: prod
      Description: Advisor Match session, catalog, booking, and metrics routes
      StageDescription:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  AdvisorApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AdvisorApi}/*/*/*

  # ---------------- frontend ----------------
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  WebSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Prefix}-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${Prefix} web app
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref WebSecurityHeaders
          Compress: true
        CacheBehaviors:
          - PathPattern: config.json
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref WebSecurityHeaders
            Compress: true
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html}

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition:
              Bool: {"aws:SecureTransport": false}

Outputs:
  WebUrl:
    Value: !Sub https://${Distribution.DomainName}
  ApiUrl:
    Value: !Sub https://${AdvisorApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod
  FunctionName:
    Value: !Ref AgentFunction
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  GuardrailId:
    Value: !GetAtt Guardrail.GuardrailId
  GuardrailVersion:
    Value: !GetAtt GuardrailVersion.Version
  BookingsTableName:
    Value: !Ref BookingsTable
  FunnelTableName:
    Value: !Ref FunnelTable
  SessionsTableName:
