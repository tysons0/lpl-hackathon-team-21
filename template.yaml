AWSTemplateFormatVersion: "2010-09-09"
Description: Advisor Match + First Meeting Ready - agentic stack (Strands on Bedrock, Lambda, S3/CloudFront, DynamoDB, Cognito, Transcribe, Polly)

Parameters:
  Prefix:
    Type: String
    Default: advisor-match
    AllowedPattern: "[a-z0-9-]+"
  ArtifactBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  LayerKey:
    Type: String
  ModelId:
    Type: String
  ExistingLambdaRoleArn:
    Type: String
    Default: ""
    Description: Optional. Use a pre-made Lambda execution role if your account can't create IAM roles.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Email for alarm notifications and the monthly cost budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
  CrmWebhookUrl:
    Type: String
    Default: ""
    Description: Optional. HTTPS endpoint that receives synced bookings. Empty = write to the S3 crm-outbox/ only.

Conditions:
  CreateRole: !Equals [!Ref ExistingLambdaRoleArn, ""]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---------------- encryption (SKILL-08: customer managed key) ----------------
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub ${Prefix} data encryption key (sessions, bookings, intake state, CRM queue)
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action: kms:*
            Resource: "*"
          - Sid: EventBridgeToEncryptedQueue
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: "*"
          - !If
            - CreateRole
            - !Ref AWS::NoValue
            - Sid: ExistingLambdaRole
              Effect: Allow
              Principal: {AWS: !Ref ExistingLambdaRoleArn}
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: "*"

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${Prefix}-data
      TargetKeyId: !Ref DataKey

  # ---------------- data ----------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: "aws:kms", KMSMasterKeyID: !GetAtt DataKey.Arn}
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-anonymous-sessions  # SKILL-01: anonymous chat history is kept for 24h only
            Status: Enabled
            Prefix: sessions/
            ExpirationInDays: 1
          - Id: expire-crm-outbox
            Status: Enabled
            Prefix: crm-outbox/
            ExpirationInDays: 30

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-bookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: booking_id, AttributeType: S}
      KeySchema:
        - {AttributeName: booking_id, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey}

  AdvisorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-advisors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: advisor_id, AttributeType: S}
      KeySchema:
        - {AttributeName: advisor_id, KeyType: HASH}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey}

  FunnelTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-funnel
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: day, AttributeType: S}
        - {AttributeName: ts_id, AttributeType: S}
      KeySchema:
        - {AttributeName: day, KeyType: HASH}
        - {AttributeName: ts_id, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey}

  # Anonymous intake state: filled preference slots, matched advisor IDs, compliance flags (SKILL-01/02).
  IntakeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-intake
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: session_id, AttributeType: S}
      KeySchema:
        - {AttributeName: session_id, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey}

  # ---------------- agent ----------------
  AgentRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: agent-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${DataBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan,
                         dynamodb:DeleteItem, dynamodb:BatchGetItem]
                Resource: [!GetAtt BookingsTable.Arn, !GetAtt FunnelTable.Arn, !GetAtt IntakeTable.Arn]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Scan]
                Resource: !GetAtt AdvisorsTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventBus.Arn
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"

  StrandsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub ${Prefix}-strands
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      Content:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LayerKey

  AgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${Prefix}-agent
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_function.lambda_handler
      Role: !If [CreateRole, !GetAtt AgentRole.Arn, !Ref ExistingLambdaRoleArn]
      MemorySize: 1024
      Timeout: 90
      Layers: [!Ref StrandsLayer]
      TracingConfig: {Mode: Active}
      LoggingConfig: {LogGroup: !Ref AgentLogGroup}
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          DATA_BUCKET: !Ref DataBucket
          BOOKINGS_TABLE: !Ref BookingsTable
          ADVISORS_TABLE: !Ref AdvisorsTable
          FUNNEL_TABLE: !Ref FunnelTable
          INTAKE_TABLE: !Ref IntakeTable
          EVENT_BUS: !Ref EventBus

  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${Prefix}/agent
      RetentionInDays: 30

  AgentUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgentFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}", "http://localhost:5173"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 300

  AgentUrlPublicInvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgentUrlPublicInvokeFunction:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------------- booking -> CRM pipeline (SKILL-05 + SKILL-10) ----------------
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub ${Prefix}-events

  CrmDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days to inspect and redrive
      KmsMasterKeyId: !Ref DataKey

  CrmQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180  # 6x the consumer timeout
      KmsMasterKeyId: !Ref DataKey
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CrmDeadLetterQueue.Arn
        maxReceiveCount: 5

  CrmQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref CrmQueue, !Ref CrmDeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: [!GetAtt CrmQueue.Arn, !GetAtt CrmDeadLetterQueue.Arn]
            Condition:
              ArnEquals: {aws:SourceArn: !GetAtt BookingRule.Arn}

  BookingRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [advisor-match.booking]
        detail-type: [ClientConsultationBooked, ClientConsultationUpdated, ClientConsultationCancelled]
      Targets:
        - Id: crm-queue
          Arn: !GetAtt CrmQueue.Arn
          RetryPolicy: {MaximumRetryAttempts: 10, MaximumEventAgeInSeconds: 3600}
          DeadLetterConfig: {Arn: !GetAtt CrmDeadLetterQueue.Arn}

  CrmSyncRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: crm-sync-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt CrmQueue.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/crm-outbox/*
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt BookingsTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt DataKey.Arn

  CrmSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${Prefix}-crm-sync
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: crm_sync.lambda_handler
      Role: !If [CreateRole, !GetAtt CrmSyncRole.Arn, !Ref ExistingLambdaRoleArn]
      MemorySize: 256
      Timeout: 30
      TracingConfig: {Mode: Active}
      LoggingConfig: {LogGroup: !Ref CrmLogGroup}
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          BOOKINGS_TABLE: !Ref BookingsTable
          CRM_WEBHOOK_URL: !Ref CrmWebhookUrl

  CrmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${Prefix}/crm-sync
      RetentionInDays: 30

  CrmQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CrmQueue.Arn
      FunctionName: !Ref CrmSyncFunction
      BatchSize: 10
      FunctionResponseTypes: [ReportBatchItemFailures]

  # ---------------- observability + cost controls (SKILL-12) ----------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${Prefix}-alarms
      Subscription: !If
        - HasAlertEmail
        - [{Protocol: email, Endpoint: !Ref AlertEmail}]
        - !Ref AWS::NoValue

  AgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Agent Lambda is throwing errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref AgentFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AgentLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p95 chat latency is above 30 seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{Name: FunctionName, Value: !Ref AgentFunction}]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  CrmDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Bookings failed to sync to the CRM and are parked in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt CrmDeadLetterQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  BookingEventFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A booking could not be published to the event bus (it will not reach the CRM)
      Namespace: AdvisorMatch
      MetricName: BookingEventFailed
      Dimensions: [{Name: Service, Value: agent}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub ${Prefix}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

  # ---------------- frontend ----------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Prefix}-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${Prefix} web app
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html}

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------- voice (browser -> Transcribe) ----------------
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: AdvisorMatchGuests
      AllowUnauthenticatedIdentities: true

  GuestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: cognito-identity.amazonaws.com}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: {"cognito-identity.amazonaws.com:aud": !Ref IdentityPool}
              ForAnyValue:StringLike: {"cognito-identity.amazonaws.com:amr": unauthenticated}
      Policies:
        - PolicyName: transcribe-streaming-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [transcribe:StartStreamTranscriptionWebSocket, transcribe:StartStreamTranscription]
                Resource: "*"

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        unauthenticated: !GetAtt GuestRole.Arn

Outputs:
  WebUrl:
    Value: !Sub https://${Distribution.DomainName}
  ApiUrl:
    Value: !GetAtt AgentUrl.FunctionUrl
  FunctionName:
    Value: !Ref AgentFunction
  AgentLogGroupName:
    Value: !Ref AgentLogGroup
  CrmLogGroupName:
    Value: !Ref CrmLogGroup
  EventBusName:
    Value: !Ref EventBus
  CrmDeadLetterQueueUrl:
    Value: !Ref CrmDeadLetterQueue
  DataBucketName:
    Value: !Ref DataBucket
  AdvisorsTableName:
    Value: !Ref AdvisorsTable
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  IdentityPoolId:
    Value: !Ref IdentityPool
